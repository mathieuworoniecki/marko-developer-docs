name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-docs.txt
      - run: python scripts/check-reference.py
      - run: npx --yes mint@4.2.964 validate
      - run: npx --yes mint@4.2.964 broken-links
      - name: Detect public contract or served version drift
        if: github.event_name != 'pull_request'
        run: python scripts/check-reference.py --live
